name: Validate fresh cloud baseline without user-data import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-clean-room-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: C0-C2 disposable cloud preflight (not production isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify runner identity and reject inherited app credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "$(id -u)" -ne 0
          test -n "${RUNNER_TEMP:-}"
          python3 - <<'PY'
          import os
          banned = (
              "OPENCLAW_HOME", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH",
              "OPENCLAW_GATEWAY_TOKEN", "OPENCLAW_GATEWAY_PASSWORD",
              "OPENCLAW_REMOTE_URL", "HERMES_HOME", "HERMES_CONFIG",
              "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "DISCORD_BOT_TOKEN",
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "GOOGLE_API_KEY",
          )
          if any(k in os.environ for k in banned):
              raise SystemExit("FAIL CLOSED: app state or credentials injected")
          print("NO_DECLARED_APP_CREDENTIALS=PASS")
          PY
          root="$(mktemp -d "${RUNNER_TEMP}/openclaw-clean-XXXXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          chmod 0700 "$root"
          mkdir -m 0700 "$root/home" "$root/state" "$root/workspace"
          test "$(stat -c '%a' "$root/home")" = 700
          test -z "$(find "$root/home" "$root/state" "$root/workspace" -mindepth 1 -print -quit)"
          test ! -L "$root"
          test ! -e "$root/state/openclaw.json"
          echo "FRESH_PRIVATE_SCRATCH=PASS"
          echo "NO_USER_DATA_INPUTS_CONFIGURED=PASS"
          echo "SCOPE: GitHub public disposable runner only, not Mac mini."

  baseline:
    name: Pinned public OpenClaw baseline-only in disposable scratch
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      OPENCLAW_DISABLE_BUNDLED_PLUGINS: "1"
    steps:
      - name: Recheck off-host runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${RUNNER_OS}" = "Linux"
          test "$(id -u)" -ne 0

      - name: Fetch only pinned public OpenClaw code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          path: upstream
          persist-credentials: false

      - name: Verify public source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "1b58cb9a1b4f4353e1add63c8506db4d890962e8"
          node -e 'const p=require("./upstream/package.json"); if (p.version!=="2026.10.5") process.exit(1)'

      - name: Use supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Install exact upstream pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@12.9.0
          test "$(pnpm --version)" = "12.9.0"

      - name: Install locked public dependencies
        working-directory: upstream
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run strictly baseline-only with empty isolated HOME
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "${RUNNER_TEMP}/openclaw-baseline-XXXXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          chmod 0700 "$root"
          mkdir -m 0700 "$root/home" "$root/state" "$root/workspace" "$root/cache" "$root/tmp"
          test -z "$(find "$root/home" "$root/state" "$root/workspace" -mindepth 1 -print -quit)"
          test ! -e "$root/state/openclaw.json"

          # Only an ephemeral home, state and workspace are passed.
          # No onboarding, import, daemon, channel setup, gateway start or messaging.
          if ! env -i \
              PATH="$PATH" HOME="$root/home" TMPDIR="$root/tmp" \
              XDG_CONFIG_HOME="$root/home/.config" XDG_CACHE_HOME="$root/cache" \
              OPENCLAW_HOME="$root/home" OPENCLAW_STATE_DIR="$root/state" \
              OPENCLAW_CONFIG_PATH="$root/state/openclaw.json" \
              OPENCLAW_DISABLE_BUNDLED_PLUGINS=1 CI=true NO_COLOR=1 \
              pnpm -C upstream openclaw setup --baseline --skip-bootstrap \
              --workspace "$root/workspace" --json \
              >"$root/baseline.stdout" 2>"$root/baseline.stderr"; then
            echo "BASELINE_ONLY_COMMAND_FAILED=FAIL"
            exit 1
          fi

          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          config_file = root / "state" / "openclaw.json"
          if not config_file.is_file() or config_file.is_symlink():
              raise SystemExit("BASELINE_CONFIG_MISSING_OR_LINKED")
          if not (root / "workspace").is_dir():
              raise SystemExit("BASELINE_WORKSPACE_MISSING")
          config = json.loads(config_file.read_text(encoding="utf-8"))
          if config.get("agents", {}).get("defaults", {}).get("skipBootstrap") is not True:
              raise SystemExit("BASELINE_SKIP_BOOTSTRAP_NOT_SET")
          if any(key in config for key in ("credentials", "auth", "channels")):
              raise SystemExit("UNEXPECTED_AUTH_OR_CHANNEL_CONFIG")
          print("FRESH_BASELINE_CONFIG_CREATED=PASS")
          print("BASELINE_SKIP_BOOTSTRAP=PASS")
          print("NO_EXPLICIT_CHANNEL_OR_AUTH_CONFIG=PASS")
          PY

          if ss -ltn '( sport = :18789 )' | grep -qE 'LISTEN'; then
            echo "DEFAULT_GATEWAY_LISTENER_PRESENT=FAIL"; exit 1
          fi
          echo "DEFAULT_GATEWAY_PORT_NOT_LISTENING=PASS"
          echo "CLOUD_BASELINE_ONLY=PASS"
          echo "PRODUCTION_MAC_ISOLATION=NOT_TESTED"
          echo "S10_ZERO_CONTACT=UNVERIFIED"
          echo "REAL_BACKUP_RESTORE_UPGRADE=NO_GO"
