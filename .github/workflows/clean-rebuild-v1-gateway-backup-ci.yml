name: Clean Rebuild v1 synthetic OpenClaw end-to-end

on:
  push:
    branches: [lab/clean-rebuild-v1-gateway-backup-ci]
    paths: [.github/workflows/clean-rebuild-v1-gateway-backup-ci.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Confirm independent host and no inherited app identities
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = edwardchongjy/openclaw-backup-lab
          test "$GITHUB_REF" = refs/heads/lab/clean-rebuild-v1-gateway-backup-ci
          test "$RUNNER_OS" = Linux
          test "$(id -u)" -ne 0
          python3 - <<'PY'
          import os
          banned = ("HERMES_HOME","OPENCLAW_HOME","OPENCLAW_STATE_DIR","OPENCLAW_CONFIG_PATH","OPENAI_API_KEY","ANTHROPIC_API_KEY","DISCORD_BOT_TOKEN","TELEGRAM_BOT_TOKEN","OPENCLAW_GATEWAY_TOKEN")
          assert not any(k in os.environ for k in banned), "ambient production state or auth"
          print("OFF_HOST_NO_DECLARED_APP_CREDENTIALS=PASS")
          PY

      - name: Check out exact public upstream without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Install pinned public dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          node -e 'if(require("./upstream/package.json").version!=="2026.10.5")process.exit(1)'
          npm install --global pnpm@12.9.0
          pnpm -C upstream install --frozen-lockfile
      - name: Create fictional data, run official archive verification, test Gateway
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/openclaw-clean-v1
          test ! -e "$root"
          mkdir -m 0700 "$root"
          for d in home state workspace cache tmp output; do mkdir -m 0700 "$root/$d"; done
          oc() {
            env -i PATH="$PATH" HOME="$root/home" TMPDIR="$root/tmp" XDG_CONFIG_HOME="$root/home/.config" XDG_CACHE_HOME="$root/cache" OPENCLAW_HOME="$root/home" OPENCLAW_STATE_DIR="$root/state" OPENCLAW_CONFIG_PATH="$root/state/openclaw.json" OPENCLAW_DISABLE_BUNDLED_PLUGINS=1 CI=true NO_COLOR=1 pnpm -C upstream openclaw "$@"
          }
          oc setup --baseline --skip-bootstrap --workspace "$root/workspace" --json > "$root/setup.json"
          # Create a brand-new fictional Agent. No credentials, channels or external providers.
          oc agents add ci-fixture --workspace "$root/workspace/ci-fixture" --non-interactive --json > "$root/agent-created.json"
          # The fake provider is loopback-only; its fixed placeholder is not a real credential.
          # Declaring it before backup proves the restored config retains the route.
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("/tmp/openclaw-clean-v1/state/openclaw.json")
          data=json.loads(p.read_text())
          data["models"]={
              "mode":"replace",
              "providers":{
                  "ci-fake":{
                      "baseUrl":"http://127.0.0.1:19042/v1",
                      "apiKey":"FICTIONAL-PLACEHOLDER-NOT-A-KEY",
                      "api":"openai-completions",
                      "models":[{
                          "id":"fake-echo","name":"Deterministic Fiction-only Stub",
                          "reasoning":False,"input":["text"],
                          "contextWindow":32768,"maxTokens":256,
                          "cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0},
                          "compat":{"supportsTools":False,"supportsUsageInStreaming":False}
                      }]
                  }
              }
          }
          data.setdefault("agents",{}).setdefault("defaults",{})["model"]={"primary":"ci-fake/fake-echo"}
          p.write_text(json.dumps(data,indent=2)+"\n")
          print("FICTION_ONLY_LOCAL_MODEL_CONFIGURED=PASS")
          PY
          oc config validate
          oc agents list --json > "$root/agents-before.json"
          python3 - <<'PY'
          import json
          rows=json.load(open("/tmp/openclaw-clean-v1/agents-before.json"))
          assert isinstance(rows,list) and any(a.get("id")=="ci-fixture" and a.get("status")!="degraded" for a in rows)
          print("NEW_FICTIONAL_AGENT_REGISTERED=PASS")
          PY
          printf "PUBLIC FICTION ONLY - NO USER DATA\n" > "$root/workspace/fixture.txt"
          printf "CI FICTIONAL AGENT WORKSPACE\n" > "$root/workspace/ci-fixture/ci-fixture.txt"
          oc backup create --dry-run --json > "$root/plan.json"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("/tmp/openclaw-clean-v1")
          assets=json.loads((root/"plan.json").read_text()).get("assets",[])
          assert assets, "no backup sources"
          for asset in assets:
              source=asset.get("sourcePath")
              assert isinstance(source,str) and pathlib.Path(source).resolve().is_relative_to(root), "out-of-scratch source rejected"
          print("FRESH_SOURCE_COVERAGE=PASS")
          PY
          oc backup create --output "$root/output/fixture.tar.gz" --verify --json > "$root/create.json"
          oc backup verify "$root/output/fixture.tar.gz" --json > "$root/verify.json"
          python3 - <<'PY'
          import tarfile, pathlib
          arc=pathlib.Path("/tmp/openclaw-clean-v1/output/fixture.tar.gz")
          with tarfile.open(arc,"r:gz") as tf:
              members=tf.getmembers()
              assert members and not any(m.name.startswith("/") or ".." in pathlib.PurePosixPath(m.name).parts for m in members)
              found=[m for m in members if m.isfile() and m.name.endswith("/fixture.txt")]
              assert len(found)==1 and tf.extractfile(found[0]).read()==b"PUBLIC FICTION ONLY - NO USER DATA\n"
          print("OFFICIAL_ARCHIVE_WITH_SYNTHETIC_FIXTURE=PASS")
          PY
          (cd "$root/output" && sha256sum fixture.tar.gz > fixture.tar.gz.sha256)

          # Start only after archive creation: test-only public token is not archived.
          oc gateway run --port 18989 --bind loopback --auth token --token PUBLIC-TEST-TOKEN-NOT-SECRET > "$root/gateway.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:18989/healthz > /dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if test "$ready" -ne 1; then echo "GATEWAY_LIVENESS=BLOCKED"; tail -n 20 "$root/gateway.log"; exit 1; fi
          ss -ltnH '( sport = :18989 )' > "$root/listeners.txt"
          python3 - <<'PY'
          from pathlib import Path
          lines=Path("/tmp/openclaw-clean-v1/listeners.txt").read_text().splitlines()
          assert lines and all("127.0.0.1:18989" in s or "::1:18989" in s or "[::1]:18989" in s for s in lines), "non-loopback listener"
          print("LOOPBACK_ONLY_GATEWAY=PASS")
          PY
          oc gateway health --port 18989 --token PUBLIC-TEST-TOKEN-NOT-SECRET > "$root/health.log"
          if oc gateway health --port 18989 --token WRONG-PUBLIC-TEST-TOKEN > "$root/denied.log" 2>&1; then
            echo "WRONG_TOKEN_REFUSAL=FAIL"; exit 1
          fi
          echo "GATEWAY_AUTH_NEGATIVE=PASS"

      - name: Upload only synthetic archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-only-archive
          path: |
            /tmp/openclaw-clean-v1/output/fixture.tar.gz
            /tmp/openclaw-clean-v1/output/fixture.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  restore:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out pinned public upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Install pinned public dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = edwardchongjy/openclaw-backup-lab
          test "$GITHUB_REF" = refs/heads/lab/clean-rebuild-v1-gateway-backup-ci
          test "$(git -C upstream rev-parse HEAD)" = 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          npm install --global pnpm@12.9.0
          pnpm -C upstream install --frozen-lockfile
      - name: Receive fictional artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-only-archive
          path: /tmp/openclaw-clean-v1-intake
      - name: Verify, restore and reject corrupt/missing input
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/openclaw-clean-v1-restore
          mkdir -m 0700 "$root"
          for d in home state workspace cache tmp; do mkdir -m 0700 "$root/$d"; done
          oc() {
            env -i PATH="$PATH" HOME="$root/home" TMPDIR="$root/tmp" XDG_CONFIG_HOME="$root/home/.config" XDG_CACHE_HOME="$root/cache" OPENCLAW_HOME="$root/home" OPENCLAW_STATE_DIR="$root/state" OPENCLAW_CONFIG_PATH="$root/state/openclaw.json" OPENCLAW_DISABLE_BUNDLED_PLUGINS=1 CI=true NO_COLOR=1 pnpm -C upstream openclaw "$@"
          }
          archive=/tmp/openclaw-clean-v1-intake/fixture.tar.gz
          (cd /tmp/openclaw-clean-v1-intake && sha256sum --check fixture.tar.gz.sha256)
          oc backup verify "$archive" --json > "$root/verify.json"
          oc backup restore "$archive" --target "$root/restored" --json > "$root/restore.json"
          marker="$(find "$root/restored" -type f -name fixture.txt -print -quit)"
          test -n "$marker"
          test "$(cat "$marker")" = "PUBLIC FICTION ONLY - NO USER DATA"
          echo "INDEPENDENT_RUNNER_RESTORE=PASS"

          head -c 128 "$archive" > "$root/corrupt.tar.gz"
          if oc backup verify "$root/corrupt.tar.gz" > /dev/null 2>&1; then echo "CORRUPT_ARCHIVE=FAIL"; exit 1; fi
          if oc backup verify "$root/missing.tar.gz" > /dev/null 2>&1; then echo "MISSING_ARCHIVE=FAIL"; exit 1; fi
          mkdir -m 0700 "$root/nonempty"
          echo FICTION > "$root/nonempty/file.txt"
          if oc backup restore "$archive" --target "$root/nonempty" > /dev/null 2>&1; then echo "NONEMPTY_RESTORE=FAIL"; exit 1; fi
          echo "NEGATIVE_RESTORE_INPUTS=PASS"
          echo "NEGATIVE_ARCHIVE_CHECKS=PASS"
          echo "PRODUCTION_BACKUP_RESTORE_UPGRADE=NO_GO"

      - name: Activate only restored fictional state and verify Agent registration and Gateway
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root=/tmp/openclaw-clean-v1-restore
          active=/tmp/openclaw-clean-v1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = edwardchongjy/openclaw-backup-lab
          test "$GITHUB_REF" = refs/heads/lab/clean-rebuild-v1-gateway-backup-ci
          test "$RUNNER_OS" = Linux
          test ! -e "$active"
          # The pinned archive format stores absolute POSIX sources under payload/posix/.
          # Locate the one verified, newly extracted archive root; never inspect outside scratch.
          count="$(find "$root/restored" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$count" -eq 1
          extracted="$(find "$root/restored" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          source="$extracted/payload/posix/tmp/openclaw-clean-v1"
          test -f "$source/state/openclaw.json"
          test -f "$source/workspace/fixture.txt"
          test -f "$source/workspace/ci-fixture/ci-fixture.txt"
          # Avoid copying any link or other source outside the expected synthetic tree.
          test -z "$(find "$source/state" "$source/workspace" -type l -print -quit)"
          mkdir -m 0700 "$active"
          cp -a "$source/state" "$source/workspace" "$active/"
          for d in home cache tmp; do mkdir -m 0700 "$active/$d"; done
          test "$(cat "$active/workspace/ci-fixture/ci-fixture.txt")" = "CI FICTIONAL AGENT WORKSPACE"
          echo "RESTORED_SYNTHETIC_STATE_ACTIVATED=PASS"

          oc() {
            env -i PATH="$PATH" HOME="$active/home" TMPDIR="$active/tmp" XDG_CONFIG_HOME="$active/home/.config" XDG_CACHE_HOME="$active/cache" OPENCLAW_HOME="$active/home" OPENCLAW_STATE_DIR="$active/state" OPENCLAW_CONFIG_PATH="$active/state/openclaw.json" OPENCLAW_GATEWAY_TOKEN=PUBLIC-TEST-TOKEN-NOT-SECRET OPENCLAW_GATEWAY_PORT=18991 OPENCLAW_DISABLE_BUNDLED_PLUGINS=1 CI=true NO_COLOR=1 pnpm -C upstream openclaw "$@"
          }
          oc agents list --json > "$root/agents-after.json"
          python3 - <<'PY'
          import json
          rows=json.load(open("/tmp/openclaw-clean-v1-restore/agents-after.json"))
          assert isinstance(rows,list)
          matches=[a for a in rows if a.get("id")=="ci-fixture"]
          assert len(matches)==1 and matches[0].get("status")!="degraded", "Agent missing or degraded after restore"
          assert matches[0].get("workspace")=="/tmp/openclaw-clean-v1/workspace/ci-fixture", "Agent workspace changed"
          print("RESTORED_AGENT_REGISTRATION=PASS")
          PY

          oc gateway run --port 18991 --bind loopback --auth token --token PUBLIC-TEST-TOKEN-NOT-SECRET > "$root/activated-gateway.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:18991/healthz > /dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if test "$ready" -ne 1; then
            echo "RESTORED_GATEWAY_START=FAIL"
            tail -n 20 "$root/activated-gateway.log"
            exit 1
          fi
          ss -ltnH '( sport = :18991 )' > "$root/activated-listeners.txt"
          python3 - <<'PY'
          from pathlib import Path
          rows=Path("/tmp/openclaw-clean-v1-restore/activated-listeners.txt").read_text().splitlines()
          assert rows and all("127.0.0.1:18991" in s or "::1:18991" in s or "[::1]:18991" in s for s in rows)
          print("RESTORED_GATEWAY_LOOPBACK=PASS")
          PY
          oc gateway health --port 18991 --token PUBLIC-TEST-TOKEN-NOT-SECRET > "$root/activated-health.log"
          oc gateway call agents.list --port 18991 --token PUBLIC-TEST-TOKEN-NOT-SECRET --json > "$root/gateway-roster.json"
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/openclaw-clean-v1-restore/gateway-roster.json"))
          roster=x.get("agents",[]) if isinstance(x,dict) else []
          assert any(a.get("id")=="ci-fixture" for a in roster), "Gateway did not load restored fictional Agent"
          print("RESTORED_GATEWAY_AGENT_ROSTER=PASS")
          PY
          # A loopback HTTP server returns exactly one fictional model response.
          # It has no outside calls or genuine model access.
          cat > "$root/fictional-model.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          ROOT=Path("/tmp/openclaw-clean-v1-restore")
          EXPECTED="CLEAN_ROOM_CI_PING_1479"
          RESPONSE="FICTION_ONLY_AGENT_REPLY_1479"
          class Handler(BaseHTTPRequestHandler):
              def log_message(self,*args): pass
              def do_GET(self):
                  if self.path != "/v1/models":
                      self.send_error(404); return
                  raw=json.dumps({"object":"list","data":[{"id":"fake-echo","object":"model","owned_by":"ci-fake"}]}).encode()
                  self.send_response(200); self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length",str(len(raw))); self.end_headers(); self.wfile.write(raw)
              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self.send_error(404); return
                  n=int(self.headers.get("Content-Length","0"))
                  if n<=0 or n>2000000:
                      self.send_error(413); return
                  body=self.rfile.read(n)
                  doc=json.loads(body)
                  if doc.get("model")!="fake-echo" or EXPECTED not in body.decode():
                      self.send_error(422); return
                  (ROOT/"fictional-model-hit.txt").write_text("FICTIONAL_REQUEST_SEEN\n")
                  chunks=[
                    {"id":"chatcmpl-ci","object":"chat.completion.chunk","created":1,"model":"fake-echo","choices":[{"index":0,"delta":{"role":"assistant","content":RESPONSE},"finish_reason":None}]},
                    {"id":"chatcmpl-ci","object":"chat.completion.chunk","created":1,"model":"fake-echo","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]},
                  ]
                  raw=("".join("data: "+json.dumps(ch)+"\n\n" for ch in chunks)+"data: [DONE]\n\n").encode()
                  self.send_response(200)
                  self.send_header("Content-Type","text/event-stream")
                  self.send_header("Content-Length",str(len(raw)))
                  self.end_headers(); self.wfile.write(raw); self.wfile.flush()
          ThreadingHTTPServer(("127.0.0.1",19042),Handler).serve_forever()
          PY
          python3 "$root/fictional-model.py" > "$root/fictional-model.log" 2>&1 &
          fake_pid=$!
          trap 'kill "$pid" "$fake_pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; wait "$fake_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            if curl -fsS --max-time 2 http://127.0.0.1:19042/v1/models > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:19042/v1/models > /dev/null
          test -z "$(ss -ltnH '( sport = :19042 )' | grep -v '127.0.0.1:19042' || true)"
          echo "LOCAL_ONLY_FAKE_AI=PASS"
          oc agent --agent ci-fixture --message CLEAN_ROOM_CI_PING_1479 --json --timeout 60 \
             > "$root/fictional-agent-turn.json"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("/tmp/openclaw-clean-v1-restore")
          data=json.loads((root/"fictional-agent-turn.json").read_text())
          result=data.get("result",{}) if isinstance(data,dict) else {}
          answers=result.get("payloads",[]) if isinstance(result,dict) else []
          print("DIAGNOSTIC_AGENT_RESULT_KEYS=", sorted(data.keys()) if isinstance(data,dict) else type(data).__name__,flush=True)
          print("DIAGNOSTIC_NESTED_RESULT_KEYS=",sorted(result.keys()) if isinstance(result,dict) else type(result).__name__,flush=True)
          print("DIAGNOSTIC_AGENT_TEXT=", [str(x.get("text",""))[:400] for x in answers] if isinstance(answers,list) else "not-list",flush=True)
          print("DIAGNOSTIC_AGENT_STATUS=",data.get("status") if isinstance(data,dict) else "not-object",flush=True)
          print("DIAGNOSTIC_AGENT_META=",str(data.get("meta",{}))[:650] if isinstance(data,dict) else "none",flush=True)
          print("DIAGNOSTIC_FAKE_SERVER_REQUEST=", (root/"fictional-model-hit.txt").exists(),flush=True)
          assert any("FICTION_ONLY_AGENT_REPLY_1479" in x.get("text","") for x in answers), "Agent final answer missing"
          assert (root/"fictional-model-hit.txt").read_text().strip()=="FICTIONAL_REQUEST_SEEN", "No real local model request"
          print("RESTORED_AGENT_COMPLETE_FAKE_TURN=PASS")
          PY
          echo "REAL_AI_ACCOUNT_OR_INTERNET_MESSAGE=NOT_TESTED"
          echo "PRODUCTION_BACKUP_RESTORE_UPGRADE=NO_GO"
