name: Native encrypted backup - independent fictional recovery
on:
  push:
    branches: [lab/native-encrypted-crossrunner-20261117]
    paths: [.github/workflows/native-encrypted-crossrunner.yml, ci/native-cross-driver.sh, ci/native-cross-helper.mjs]
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha256: ${{ steps.test.outputs.sha256 }}
    steps:
      - name: Checkout exact public test candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: lab
          persist-credentials: false
      - name: Checkout pinned public upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Real native encrypted produce and boundary checks
        id: test
        shell: bash
        env:
          CI_FICTIONAL_PASSPHRASE: PUBLIC_LAB_KEY_NOT_SECRET_DO_NOT_USE_FOR_REAL_OPENCLAW
        run: bash lab/ci/native-cross-driver.sh produce
      - name: Transfer bounded public dummy-key ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-fiction-${{ github.run_id }}
          path: ${{ runner.temp }}/native-transfer.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  restore:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Download only fictional encrypted storage from distinct producer job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-fiction-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-input
      - name: Checkout exact public test candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: lab
          persist-credentials: false
      - name: Checkout pinned public upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Real native encrypted restore and boundary checks
        id: test
        shell: bash
        env:
          CI_FICTIONAL_PASSPHRASE: PUBLIC_LAB_KEY_NOT_SECRET_DO_NOT_USE_FOR_REAL_OPENCLAW
          CI_EXPECTED_ARCHIVE_SHA: ${{ needs.produce.outputs.sha256 }}
        run: bash lab/ci/native-cross-driver.sh restore
