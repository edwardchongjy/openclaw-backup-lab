name: Clean Rebuild v1 - native encrypted backup across independent GitHub runners
on:
  push:
    branches: [lab/clean-rebuild-v1-gateway-backup-ci]
    paths:
      - .github/workflows/clean-rebuild-v1-encrypted-crossrunner.yml
      - ci/clean-v1-encrypted-cross-driver.sh
      - ci/clean-v1-encrypted-cross-check.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha256: ${{ steps.create.outputs.sha256 }}
      manifest_sha256: ${{ steps.create.outputs.manifest_sha256 }}
    steps:
      - name: Checkout only the current PUBLIC test harness revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: lab
          persist-credentials: false
      - name: Checkout immutable upstream PUBLIC OpenClaw source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          path: upstream
          persist-credentials: false
      - name: Node 24.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Create native encrypted backup from fresh fictional state
        id: create
        shell: bash
        env:
          CI_FICTIONAL_PASSPHRASE: PUBLIC_LAB_KEY_NOT_SECRET_DO_NOT_USE_FOR_REAL_OPENCLAW
        run: bash lab/ci/clean-v1-encrypted-cross-driver.sh produce
      - name: Transfer only the bounded public fiction-only archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-encrypted-fiction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/encrypted-store.tar
            ${{ runner.temp }}/expected-files.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  restore:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Retrieve fictional archive from separate producer job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-encrypted-fiction-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-input
      - name: Checkout only the current PUBLIC test harness revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: lab
          persist-credentials: false
      - name: Checkout immutable upstream PUBLIC OpenClaw source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 1b58cb9a1b4f4353e1add63c8506db4d890962e8
          path: upstream
          persist-credentials: false
      - name: Node 24.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Restore native ciphertext, compare static files and reject wrong key and tampering
        shell: bash
        env:
          CI_FICTIONAL_PASSPHRASE: PUBLIC_LAB_KEY_NOT_SECRET_DO_NOT_USE_FOR_REAL_OPENCLAW
          CI_EXPECTED_MANIFEST_SHA: ${{ needs.produce.outputs.manifest_sha256 }}
          CI_EXPECTED_ARCHIVE_SHA: ${{ needs.produce.outputs.sha256 }}
        run: bash lab/ci/clean-v1-encrypted-cross-driver.sh restore
